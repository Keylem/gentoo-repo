name: Gentoo systemd Portage dependency QA

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  gentoo-portage:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Validate every package atom in systemd Gentoo stage3
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/var/db/repos/keylem:ro" \
            gentoo/stage3:systemd bash -euo pipefail -c '
              mkdir -p /etc/portage/repos.conf /etc/portage/package.accept_keywords
              printf "[keylem]\nlocation = /var/db/repos/keylem\nmasters = gentoo\nauto-sync = no\n" > /etc/portage/repos.conf/keylem.conf
              echo ":: Downloading current Gentoo ebuild tree"
              emerge-webrsync
              : > /etc/portage/package.accept_keywords/kait2en
              for ebuild in /var/db/repos/keylem/*/*/*.ebuild; do
                atom="${ebuild#/var/db/repos/keylem/}"
                atom="${atom%/*}"
                printf "%s **\n" "${atom}" >> /etc/portage/package.accept_keywords/kait2en
              done
              mkdir -p /etc/portage/package.use
              printf "media-libs/libglvnd X\nnet-wireless/wpa_supplicant dbus\nsys-kernel/installkernel dracut\nsys-apps/systemd policykit\nmedia-libs/freetype harfbuzz\nx11-libs/cairo X\nsys-fs/zfs dist-kernel modules\n" > /etc/portage/package.use/kait2en-ci
              export FEATURES="${FEATURES:-} -ipc-sandbox -network-sandbox -pid-sandbox"
              mkdir -p /etc/portage/package.license
              # Explicitly test the user-provided proprietary firmware package,
              # without opening the global ACCEPT_LICENSE policy.
              printf 'sys-firmware/kait2en-wifi-firmware all-rights-reserved\n' > /etc/portage/package.license/kait2en-wifi
              echo ":: Portage pretend plans, one independent package at a time"
              failures=0
              while IFS= read -r atom; do
                [[ -n ${atom} ]] || continue
                echo ":: Checking ${atom}"
                if ! emerge --pretend --oneshot --verbose "${atom}" > /tmp/kait2en-plan 2>&1; then
                  cat /tmp/kait2en-plan
                  failures=$(( failures + 1 ))
                fi
              done < <(sed "s/ \*\*$//" /etc/portage/package.accept_keywords/kait2en | sort -u)
              echo ":: Checking all default metapackage dependencies"
              emerge --pretend --verbose --oneshot app-misc/kait2en >/tmp/kait2en-plan 2>&1 || { cat /tmp/kait2en-plan; failures=$(( failures + 1 )); }
              if (( failures > 0 )); then echo "FAIL: $failures Portage dependency plans failed" >&2; exit 1; fi
              echo "PASS: Portage resolved independently installable package metadata and default metapackage"
              echo ":: Checking opt-in kernel-sources metapackage flag"
              printf 'app-misc/kait2en kernel-sources -kernel-zfs -apps\n' >> /etc/portage/package.use/kait2en-ci
              emerge --pretend --verbose --oneshot app-misc/kait2en >/tmp/kait2en-plan 2>&1 ||
                { cat /tmp/kait2en-plan; exit 1; }
              echo ":: Checking opt-in distribution-kernel + OpenZFS metapackage flag"
              sed -i '/^app-misc\/kait2en kernel-sources /d' /etc/portage/package.use/kait2en-ci
              printf 'app-misc/kait2en kernel-zfs -kernel-sources -apps\n' >> /etc/portage/package.use/kait2en-ci
              emerge --pretend --verbose --oneshot app-misc/kait2en >/tmp/kait2en-plan 2>&1 ||
                { cat /tmp/kait2en-plan; exit 1; }
              echo "PASS: Portage resolved both optional kernel source and OpenZFS combinations"

              echo ":: Testing Portage install / forced reinstall / unmerge on lightweight packages"
              bash /var/db/repos/keylem/metadata/tests/smoke_portage_lifecycle.sh
            '
